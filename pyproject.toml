[project]
name = "kaplancloud"
version = "0.6.0.dev0"
requires-python = ">=3.12"

[tool.uv]
package = false
default-groups = ["dev"]

[dependency-groups]
prod = [
    "Django~=5.2",
    "djangorestframework~=3.17",
    "django-storages[boto3,google]>=1.14,<2.0",
    "kaplan>=0.16,<0.17",
    "psycopg2-binary>=2.9,<3.0",
    "django-tailwind>=4.4,<5.0",
    "gunicorn>=25.0,<26.0",
    "python-dotenv>=1.0,<2.0",
]
dev = [
    {include-group = "prod"},
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "DJ",  # flake8-django
    "RUF", # ruff-specific rules
]
# Existing codebase violations — to be addressed incrementally
extend-ignore = [
    "DJ008",  # models missing __str__
    "DJ012",  # method/class ordering in models
    "RUF005", # iterable unpacking in migrations
    "RUF012", # mutable class attributes (Django Meta.ordering pattern)
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]
"kaplancloud/settings.py" = ["E501"]
"kaplancloudapp/forms.py" = ["E501"]
"kaplancloudapp/models.py" = ["E501"]
